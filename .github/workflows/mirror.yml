name: Mirror Grok Build → GitHub Release

on:
  schedule:
    # Every 6 hours UTC
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - alpha
          - enterprise
      force:
        description: "Re-download even if version unchanged"
        required: false
        default: false
        type: boolean
      version:
        description: "Optional pinned version (empty = latest of channel)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: mirror-grok-build
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve inputs
        id: opts
        shell: bash
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          VERSION="${{ github.event.inputs.version || '' }}"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch artifacts from GCS
        working-directory: scripts
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "${{ steps.opts.outputs.force }}" == "true" ]]; then
            EXTRA+=(--force)
          fi
          if [[ -n "${{ steps.opts.outputs.version }}" ]]; then
            EXTRA+=(--version "${{ steps.opts.outputs.version }}")
          fi
          python fetch_artifacts.py \
            --channel "${{ steps.opts.outputs.channel }}" \
            --out ../artifacts \
            --state ../mirror/latest.json \
            "${EXTRA[@]}"

      - name: Detect skip
        id: skip
        shell: bash
        run: |
          if [[ -f artifacts/SKIP ]] || jq -e '.skipped == true' artifacts/manifest.json >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new version; job will stop after this."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            VERSION="$(jq -r .version artifacts/manifest.json)"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "### New version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.files[] | "- `\(.filename)` · \(.size) bytes · sha256 `\(.sha256[:16])…`"' artifacts/manifest.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish GitHub Release
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_STATE: "1"
        shell: bash
        run: |
          chmod +x scripts/publish_github_release.sh
          scripts/publish_github_release.sh
